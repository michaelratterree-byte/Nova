<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Your Personal OS</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #7f77dd;
    --accent-bg: rgba(127,119,221,0.12);
    --accent-border: rgba(127,119,221,0.3);
    --green: #1d9e75;
    --green-bg: rgba(29,158,117,0.1);
    --amber: #ef9f27;
    --amber-bg: rgba(239,159,39,0.1);
    --pink: #d4537e;
    --pink-bg: rgba(212,83,126,0.1);
    --blue: #378add;
    --blue-bg: rgba(55,138,221,0.1);
    --coral: #d85a30;
    --coral-bg: rgba(216,90,48,0.1);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 100vh; overflow: hidden; }
  .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* Sidebar */
  .sidebar-header { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-bg); border: 1px solid var(--accent-border); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .logo-name { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--muted); }
  .api-section { }
  .api-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .api-row { display: flex; gap: 6px; }
  .api-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--text); font-size: 12px; font-family: monospace; }
  .api-row input:focus { outline: none; border-color: var(--accent-border); }
  .api-btn { background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: 7px 12px; color: var(--accent); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .api-btn:hover { background: rgba(127,119,221,0.2); }
  .api-status { font-size:11px; margin-top: 5px; }
  .api-status.ok { color: var(--green); }
  .api-status.err { color: #e24b4a; }

  .nav { padding: 12px 8px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 8px; margin-bottom: 6px; margin-top: 12px; }
  .nav-label:first-child { margin-top: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--muted); font-size: 13px; transition: all 0.15s; border: 1px solid transparent; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }

  .memory-sidebar { padding: 12px; border-top: 1px solid var(--border); }
  .mem-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .mem-area textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; color: var(--text); font-size: 11px; font-family: monospace; resize: none; height: 100px; line-height: 1.5; }
  .mem-area textarea:focus { outline: none; border-color: var(--accent-border); }
  .mem-btns { display: flex; gap: 6px; margin-top: 6px; }
  .mem-save { background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: 5px 10px; color: var(--accent); font-size: 11px; cursor: pointer; }
  .mem-save:hover { background: rgba(127,119,221,0.2); }
  .mem-clear { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; color: var(--muted); font-size: 11px; cursor: pointer; }
  .mem-clear:hover { border-color: var(--border2); color: var(--text); }
  .mem-status { font-size: 10px; color: var(--green); margin-top: 4px; display: none; }

  /* Main */
  .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .chat-title { font-size: 15px; font-weight: 600; }
  .chat-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .mode-pills { display: flex; gap: 6px; }
  .mode-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); color: var(--muted); background: transparent; transition: all 0.15s; }
  .mode-pill.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; }
  .msg.user { align-self: flex-end; }
  .msg.agent { align-self: flex-start; }
  .msg-bubble { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.6; }
  .msg.user .msg-bubble { background: var(--accent-bg); border: 1px solid var(--accent-border); color: var(--text); border-bottom-right-radius: 3px; }
  .msg.agent .msg-bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 3px; }
  .msg.full { max-width: 100%; width: 100%; }
  .msg.full .msg-bubble { border-radius: var(--radius); }

  /* Structured outputs */
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; width: 100%; }
  .result-top { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
  .result-section { margin-bottom: 12px; }
  .result-section:last-child { margin-bottom: 0; }
  .result-area-label { font-size: 11px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .result-body { font-size: 13px; color: var(--text); line-height: 1.55; }
  .result-tip { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .goal-item { display: flex; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .goal-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .goal-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .goal-text { font-size: 13px; line-height: 1.5; flex: 1; }
  .goal-why { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .area-tag { font-size: 10px; padding: 1px 7px; border-radius: 20px; display: inline-block; margin-left: 4px; vertical-align: middle; }
  .push-box { background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; font-style: italic; color: var(--accent); }
  .output-block { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
  .output-block-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  .bullet { display: flex; gap: 8px; margin-bottom: 5px; font-size: 13px; }
  .bullet-dot { color: var(--accent); flex-shrink: 0; margin-top: 1px; }

  /* Input */
  .input-area { padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .input-row textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-size: 13px; font-family: inherit; resize: none; min-height: 44px; max-height: 120px; line-height: 1.5; }
  .input-row textarea:focus { outline: none; border-color: var(--accent-border); }
  .send-btn { background: var(--accent); border: none; border-radius: var(--radius); padding: 10px 16px; color: white; font-size: 13px; font-weight: 500; cursor: pointer; height: 44px; white-space: nowrap; }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .qbtn { font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--muted); transition: all 0.15s; }
  .qbtn:hover { border-color: var(--border2); color: var(--text); }

  /* Typing */
  .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: blink 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

  /* Setup screen */
  .setup { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
  .setup-inner { max-width: 420px; text-align: center; }
  .setup-icon { font-size: 40px; margin-bottom: 16px; }
  .setup-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
  .setup-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
  .setup-steps { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
  .setup-step { font-size: 13px; margin-bottom: 10px; display: flex; gap: 10px; }
  .setup-step:last-child { margin-bottom: 0; }
  .step-num { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .setup-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .setup-link:hover { text-decoration: underline; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">✦</div>
        <div>
          <div class="logo-name">Nova</div>
          <div class="logo-sub">Personal OS</div>
        </div>
      </div>
      <div class="api-section">
        <div class="api-label">Anthropic API Key</div>
        <div class="api-row">
          <input type="password" id="api-key" placeholder="sk-ant-..." />
          <button class="api-btn" onclick="saveKey()">Save</button>
        </div>
        <div class="api-status" id="api-status"></div>
      </div>
    </div>

    <div class="nav">
      <div class="nav-label">Modes</div>
      <div class="nav-item active" onclick="setMode('chat')" id="nav-chat">
        <span class="nav-icon">💬</span> Chat
      </div>
      <div class="nav-item" onclick="setMode('goals')" id="nav-goals">
        <span class="nav-icon">🎯</span> Goals
      </div>
      <div class="nav-item" onclick="setMode('digest')" id="nav-digest">
        <span class="nav-icon">📄</span> Digest
      </div>
      <div class="nav-item" onclick="setMode('output')" id="nav-output">
        <span class="nav-icon">⚡</span> Output machine
      </div>
    </div>

    <div class="memory-sidebar">
      <div class="mem-label">Memory</div>
      <div class="mem-area">
        <textarea id="memory-text" placeholder="Your goals, habits, context…"></textarea>
      </div>
      <div class="mem-btns">
        <button class="mem-save" onclick="saveMemory()">Save</button>
        <button class="mem-clear" onclick="resetMemory()">Reset</button>
      </div>
      <div class="mem-status" id="mem-status">✓ Memory saved</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="chat-title">Chat</div>
        <div class="chat-sub" id="chat-sub">Talk to Nova about anything</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="user-input" placeholder="Talk to Nova…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMsg()" id="send-btn">Send →</button>
      </div>
      <div class="quick-row" id="quick-row"></div>
    </div>
  </div>
</div>

<script>
const DEFAULT_MEMORY = `=== NOVA PERSONAL MEMORY ===

NAME: [Your name]
AGE: 18
LOCATION: Fort Worth, TX → Colleyville target

--- THE VISION (10 year target) ---
- Live in a $1.5M house in Colleyville, TX
- Financial freedom
- Married with family + real time to spend with them
- Own 3 cars, a wake boat, jetski
- Build something that lasts

--- CURRENT SITUATION ---
- Age 18, summer before college
- Paid RE commercial internship at $15/hr
- Starting Tarleton State in fall (1 year plan)
- Transferring to Texas A&M
- Pursuing Finance + Real Estate degree
- Phase 1: building personal AI systems

--- EDUCATION ROADMAP ---
- Tarleton (Year 1): GPA, RE experience, investing basics, low cost
- Texas A&M: Finance + RE degree, build network aggressively
- Target graduation: ~23 years old

--- CAREER PATH ---
- Commercial Real Estate as primary income vehicle
- Finance knowledge to build and invest wealth
- Own assets, not just earn a salary
- AI systems as side skill/business

--- AI BUSINESS ROADMAP ---
Phase 1 (NOW): Build + use personal AI systems daily
Phase 2: Document, post, build audience
Phase 3: Teach no-code AI systems (course)
Phase 4: Build AI systems for small businesses

--- NOTES FOR NOVA ---
- Always connect advice to long-term vision
- Push me when I need it
- Help set daily goals that ladder to the big vision
- Reports should cover all life areas + vision progress`;

let apiKey = localStorage.getItem('nova_api_key') || '';
let memory = localStorage.getItem('nova_memory') || DEFAULT_MEMORY;
let mode = 'chat';
let history = [];

const MODES = {
  chat: {
    title: 'Chat', sub: 'Talk to Nova about anything',
    placeholder: 'Talk to Nova…',
    quick: ['What should I focus on today?', 'Give me a daily report', 'Am I on track this week?'],
    system: (m) => `You are Nova, a personal AI operating system for an 18-year-old in Fort Worth TX with a clear vision: Colleyville house, financial freedom, family, wake boat by ~30. You know his full context. Route to specialists internally (work, wellness, home, finance, social). Respond in 2-3 sentences for normal messages, always connecting to his vision. Push him when needed. For report requests respond ONLY with valid JSON: {"type":"report","sections":[{"area":"Work","summary":"...","tip":"..."},{"area":"Wellness","summary":"...","tip":"..."},{"area":"Home","summary":"...","tip":"..."},{"area":"Finance","summary":"...","tip":"..."},{"area":"Social","summary":"...","tip":"..."}]}\n\nUSER MEMORY:\n${m}`
  },
  goals: {
    title: 'Goals', sub: 'Daily goals that connect to your vision',
    placeholder: "Ask for today's goals, weekly focus, or describe a new goal…",
    quick: ["What are my goals for today?", "Am I on track for my vision?", "Design a 30-day challenge for me"],
    system: (m) => `You are Nova, a goal architecture AI. Respond ONLY with valid JSON: {"type":"goals","daily":[{"goal":"...","why":"...","area":"..."}],"weekly":["...","...","..."],"vision_check":"...","push":"..."}. daily: 3-5 specific actionable goals for today laddering to Colleyville vision (area = work/finance/health/relationships/ai). weekly: 3 focus themes. vision_check: honest sentence on trajectory. push: direct no-fluff motivational nudge.\n\nUSER MEMORY:\n${m}`
  },
  digest: {
    title: 'Digest', sub: 'Paste anything — get what matters',
    placeholder: 'Paste an article, transcript, or any block of text…',
    quick: ['Key bullets + takeaway', 'How does this relate to RE or finance?', 'Turn this into a social hook'],
    system: (m) => `You are an information digest AI. Respond ONLY with valid JSON: {"type":"digest","title":"...","bullets":["...","...","...","...","..."],"takeaway":"...","hook":"..."}. title: short. bullets: 5 key points. takeaway: single most important insight. hook: punchy social post opener. Connect to user's RE/finance/AI path when relevant.\n\nUSER CONTEXT:\n${m}`
  },
  output: {
    title: 'Output machine', sub: 'Ideas → content in seconds',
    placeholder: 'Describe your idea, topic, or product…',
    quick: ['TikTok/Reel script', 'Twitter/X thread', 'Content angle for my RE path'],
    system: (m) => `You are an output machine AI. Respond ONLY with valid JSON: {"type":"output","tiktok":"...","thread":["...","...","..."],"caption":"...","idea":"..."}. tiktok: 3-sentence hook. thread: 3 tweets max 280 chars each. caption: Instagram caption with line breaks. idea: one unused angle connecting to RE, finance, or AI.\n\nUSER CONTEXT:\n${m}`
  }
};

function init() {
  if(apiKey) {
    document.getElementById('api-key').value = apiKey;
    document.getElementById('api-status').textContent = '✓ Key loaded';
    document.getElementById('api-status').className = 'api-status ok';
  }
  document.getElementById('memory-text').value = memory;
  setMode('chat');
}

function saveKey() {
  const val = document.getElementById('api-key').value.trim();
  if(!val) return;
  apiKey = val;
  localStorage.setItem('nova_api_key', val);
  document.getElementById('api-status').textContent = '✓ Saved';
  document.getElementById('api-status').className = 'api-status ok';
}

function saveMemory() {
  memory = document.getElementById('memory-text').value.trim() || DEFAULT_MEMORY;
  localStorage.setItem('nova_memory', memory);
  const s = document.getElementById('mem-status');
  s.style.display = 'block';
  setTimeout(() => s.style.display = 'none', 2000);
}

function resetMemory() {
  memory = DEFAULT_MEMORY;
  document.getElementById('memory-text').value = DEFAULT_MEMORY;
  localStorage.setItem('nova_memory', DEFAULT_MEMORY);
}

function setMode(m) {
  mode = m;
  const cfg = MODES[m];
  ['chat','goals','digest','output'].forEach(t => {
    document.getElementById('nav-'+t).classList.toggle('active', t===m);
  });
  document.getElementById('chat-title').textContent = cfg.title;
  document.getElementById('chat-sub').textContent = cfg.sub;
  document.getElementById('user-input').placeholder = cfg.placeholder;
  document.getElementById('quick-row').innerHTML = cfg.quick.map(q =>
    `<button class="qbtn" onclick="quickSend('${q.replace(/'/g,"\\'")}')">↗ ${q}</button>`
  ).join('');
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  const greetings = {
    chat: "Memory loaded. I know your vision, your path, and where you're at. What do you need?",
    goals: "Let's build your goals. Ask for today's daily goals, check your vision trajectory, or design a challenge.",
    digest: "Paste any article, transcript, or notes. I'll pull out what matters and connect it to your path.",
    output: "Give me an idea or topic. I'll generate scripts, threads, captions, and angles."
  };
  addMsg('agent', greetings[m]);
  if(m === 'chat') history = [];
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function quickSend(text) {
  document.getElementById('user-input').value = text;
  sendMsg();
}

function addMsg(role, content, type) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');

  if(type === 'report') {
    wrap.className = 'msg full';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="result-top">📊 Daily report</div>`;
    const colors = {
      Work:{c:'#378add',bg:'rgba(55,138,221,0.15)'},
      Wellness:{c:'#1d9e75',bg:'rgba(29,158,117,0.15)'},
      Home:{c:'#ef9f27',bg:'rgba(239,159,39,0.15)'},
      Finance:{c:'#7f77dd',bg:'rgba(127,119,221,0.15)'},
      Social:{c:'#d4537e',bg:'rgba(212,83,126,0.15)'}
    };
    content.forEach(s => {
      const col = colors[s.area] || colors.Work;
      const sec = document.createElement('div');
      sec.className = 'result-section';
      sec.innerHTML = `<div class="result-area-label" style="color:${col.c}">${s.area}</div><div class="result-body">${s.summary}</div><div class="result-tip">→ ${s.tip}</div>`;
      card.appendChild(sec);
    });
    wrap.appendChild(card);
  } else if(type === 'goals') {
    wrap.className = 'msg full';
    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `<div class="result-top">🎯 Your goals</div>`;
    const areaC = {work:'#378add',finance:'#7f77dd',health:'#1d9e75',relationships:'#d4537e',ai:'#ef9f27'};
    const areaBg = {work:'rgba(55,138,221,0.15)',finance:'rgba(127,119,221,0.15)',health:'rgba(29,158,117,0.15)',relationships:'rgba(212,83,126,0.15)',ai:'rgba(239,159,39,0.15)'};
    if(content.daily?.length) {
      const sec = document.createElement('div'); sec.className = 'result-section';
      sec.innerHTML = '<div class="result-area-label" style="color:var(--muted)">Today</div>';
      content.daily.forEach(g => {
        const a = (g.area||'work').toLowerCase();
        const item = document.createElement('div'); item.className = 'goal-item';
        item.innerHTML = `<div class="goal-dot" style="background:${areaC[a]||'#7f77dd'}"></div><div class="goal-text">${g.goal}<div class="goal-why">${g.why} <span class="area-tag" style="background:${areaBg[a]||areaBg.finance};color:${areaC[a]||'#7f77dd'}">${g.area}</span></div></div>`;
        sec.appendChild(item);
      });
      card.appendChild(sec);
    }
    if(content.weekly?.length) {
      const sec = document.createElement('div'); sec.className = 'result-section';
      sec.innerHTML = `<div class="result-area-label" style="color:var(--muted)">This week</div><div class="result-body">${content.weekly.map((w,i)=>`<div style="margin-bottom:4px">${i+1}. ${w}</div>`).join('')}</div>`;
      card.appendChild(sec);
    }
    if(content.vision_check) {
      const sec = document.createElement('div'); sec.className = 'result-section';
      sec.innerHTML = `<div class="result-area-label" style="color:var(--muted)">Vision check</div><div class="result-body" style="color:var(--muted)">${content.vision_check}</div>`;
      card.appendChild(sec);
    }
    if(content.push) {
      const sec = document.createElement('div'); sec.className = 'result-section';
      sec.innerHTML = `<div class="result-area-label" style="color:var(--accent)">Push</div><div class="push-box">${content.push}</div>`;
      card.appendChild(sec);
    }
    wrap.appendChild(card);
  } else if(type === 'digest') {
    wrap.className = 'msg full';
    const card = document.createElement('div'); card.className = 'result-card';
    card.innerHTML = `<div class="result-top">📄 ${content.title||'Digest'}</div>
      <div class="result-section"><div class="result-area-label" style="color:var(--muted)">Key points</div><div class="result-body">${(content.bullets||[]).map(b=>`<div class="bullet"><span class="bullet-dot">·</span>${b}</div>`).join('')}</div></div>
      <div class="result-section"><div class="result-area-label" style="color:var(--muted)">Main takeaway</div><div class="result-body">${content.takeaway||''}</div></div>
      <div class="result-section"><div class="result-area-label" style="color:var(--muted)">Social hook</div><div class="result-body" style="font-style:italic;color:var(--muted)">"${content.hook||''}"</div></div>`;
    wrap.appendChild(card);
  } else if(type === 'output') {
    wrap.className = 'msg full';
    const card = document.createElement('div'); card.className = 'result-card';
    card.innerHTML = `<div class="result-top">⚡ Content outputs</div>
      <div class="output-block-label">TikTok / Reel hook</div><div class="output-block">${content.tiktok||''}</div>
      <div class="output-block-label">Twitter / X thread</div><div class="output-block">${(content.thread||[]).map((t,i)=>`<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:${i<content.thread.length-1?'1px solid rgba(255,255,255,0.06)':'none'}">${i+1}/ ${t}</div>`).join('')}</div>
      <div class="output-block-label">Instagram caption</div><div class="output-block" style="white-space:pre-line">${content.caption||''}</div>
      <div class="output-block-label">Angle you haven't tried</div><div class="output-block" style="color:var(--muted)">${content.idea||''}</div>`;
    wrap.appendChild(card);
  } else if(type === 'typing') {
    wrap.className = 'msg agent'; wrap.id = 'typing';
    const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    wrap.appendChild(bubble);
  } else {
    wrap.className = 'msg ' + (role==='user'?'user':'agent');
    const bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    bubble.textContent = content;
    wrap.appendChild(bubble);
  }

  msgs.appendChild(wrap);
  wrap.scrollIntoView({block:'end',behavior:'smooth'});
  return wrap;
}

async function sendMsg() {
  if(!apiKey) {
    addMsg('agent', 'Add your Anthropic API key in the sidebar first. Get one free at console.anthropic.com.');
    return;
  }
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  addMsg('user', text);
  if(mode==='chat') history.push({role:'user', content:text});
  const typing = addMsg('','','typing');

  try {
    const messages = mode==='chat' ? history : [{role:'user',content:text}];
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: MODES[mode].system(memory),
        messages
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const reply = (data.content||[]).map(c=>c.text||'').join('').trim();
    if(mode==='chat') history.push({role:'assistant',content:reply});
    typing.remove();
    let parsed = null;
    try { parsed = JSON.parse(reply); } catch(e){}
    if(parsed?.type==='report') addMsg('agent', parsed.sections, 'report');
    else if(parsed?.type==='goals') addMsg('agent', parsed, 'goals');
    else if(parsed?.type==='digest') addMsg('agent', parsed, 'digest');
    else if(parsed?.type==='output') addMsg('agent', parsed, 'output');
    else addMsg('agent', reply);
  } catch(e) {
    typing.remove();
    addMsg('agent', 'Error: ' + (e.message || 'Something went wrong. Check your API key and try again.'));
  }
  document.getElementById('send-btn').disabled = false;
  document.getElementById('user-input').focus();
}

init();
</script>
